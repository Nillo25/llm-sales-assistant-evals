# Store FAQ of the fictional "Ampwise" brand.

- question: How long does shipping take?
  answer: Orders ship within 1 business day. Standard delivery takes 3 to 6 business days after dispatch.

- question: How much does shipping cost?
  answer: Shipping is free on orders over $50. Smaller orders ship for a flat $4.99.

- question: What is your return policy?
  answer: You can return unused items in their original packaging within 30 days of delivery. We refund the original payment method within 5 business days after the return arrives.

- question: What warranty do you offer?
  answer: All Ampwise products come with an 18-month limited warranty that covers manufacturing defects. Contact support with your order number to make a claim.

- question: Which payment methods do you accept?
  answer: Visa, Mastercard, American Express, PayPal and Apple Pay.

- question: How can I track my order?
  answer: We email you a tracking link as soon as the order ships.

- question: Can I change or cancel my order?
  answer: Yes, within 2 hours of placing it. Write to support and include your order number.

- question: How do I contact support?
  answer: Email support@ampwise.example. We reply within one business day.
