name: evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model under test
        default: gpt-4.1-mini
      prompt:
        description: Prompt version
        default: v1
      runs:
        description: Runs per case
        default: "3"
      fail_under:
        description: Fail the job if the overall pass rate is below this (0-1)
        default: "0.75"
      judge:
        description: Also score run 1 with the LLM judge (slower, about $0.5)
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC, default settings, no judge

permissions:
  contents: read

jobs:
  evals:
    name: Live evals (calls a paid API)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ inputs.model || 'gpt-4.1-mini' }}
      PROMPT: ${{ inputs.prompt || 'v1' }}
      RUNS: ${{ inputs.runs || '3' }}
      FAIL_UNDER: ${{ inputs.fail_under || '0.75' }}
      JUDGE: ${{ inputs.judge || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r ${{ env.JUDGE == 'true' && 'requirements-judge.txt' || 'requirements.txt' }}
      - name: Run the eval suite
        id: run
        run: |
          set +e
          python scripts/run_evals.py --model "$MODEL" --prompt "$PROMPT" --runs "$RUNS" \
            --fail-under "$FAIL_UNDER" --out ci-reports
          echo "gate=$?" >> "$GITHUB_OUTPUT"
      - name: Judge run 1
        if: env.JUDGE == 'true'
        run: python scripts/judge_run.py ci-reports/raw/*_"$MODEL"_"$PROMPT".json --out ci-reports
      - name: Job summary
        if: always()
        run: cat ci-reports/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: ci-reports/
      - name: Quality gate
        if: steps.run.outputs.gate != '0'
        run: |
          echo "Overall pass rate is below $FAIL_UNDER (or the run failed); see the report above."
          exit 1
